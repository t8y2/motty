name: Go tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded run is cancelled, pushes to main included: a newer push to the
# same ref contains everything the older one would have tested, and leaving the
# older run in place makes the newer one wait for ten jobs it cannot use.
concurrency:
  group: go-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Motty's go.mod replaces Viva with the sibling ../viva checkout.
      - uses: actions/checkout@v7
        with:
          path: motty
      - uses: actions/checkout@v7
        with:
          repository: vivaui/viva
          path: viva
      - uses: actions/setup-go@v7
        with:
          go-version-file: motty/go.mod
          cache-dependency-path: motty/go.sum
      - name: Check formatting
        working-directory: motty
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet release build
        working-directory: motty
        run: go vet ./...
      - name: Vet development components
        working-directory: motty
        run: go vet -tags dev ./internal/workbench

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: motty
      - uses: actions/checkout@v7
        with:
          repository: vivaui/viva
          path: viva
      - uses: actions/setup-go@v7
        with:
          go-version-file: motty/go.mod
          cache-dependency-path: motty/go.sum
      - name: Test release build
        working-directory: motty
        run: go test ./... -count=1

  # The dev-tagged suite is a job of its own rather than a second step of the
  # job above: run in sequence the two suites made one job the longest one in
  # the workflow, and neither needs the other's build. It compiles the workbench
  # package again with the dev tag, so it stays cheaper than the release suite.
  dev-tests:
    name: Development components
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: motty
      - uses: actions/checkout@v7
        with:
          repository: vivaui/viva
          path: viva
      - uses: actions/setup-go@v7
        with:
          go-version-file: motty/go.mod
          cache-dependency-path: motty/go.sum
      - name: Test development components
        working-directory: motty
        run: go test -tags dev ./cmd/motty ./internal/workbench -count=1

  # The Windows tests build only on Windows, so the Linux jobs above never
  # compile them. This job keeps the package and its Windows command/parser
  # tests building; -short skips the real CIM query, which needs a live host.
  windows-remote-tools:
    name: Remote tools (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: motty
      - uses: actions/checkout@v7
        with:
          repository: vivaui/viva
          path: viva
      - uses: actions/setup-go@v7
        with:
          go-version-file: motty/go.mod
          cache-dependency-path: motty/go.sum
      - name: Test remote tools platform handling
        working-directory: motty
        run: go test -short -run 'Test(Windows|Darwin|Docker)' ./internal/remotetools -count=1

  # A Windows checkout converts line endings when core.autocrlf is true, which
  # is the Git for Windows default. The embedded completion catalog is a
  # byte-exact format and the ssh_config parser reads Windows paths, so this job
  # checks out with the conversion on and runs the packages that depend on it.
  windows-checkout:
    name: Windows checkout (autocrlf)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Convert line endings on checkout
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v7
        with:
          path: motty
      - uses: actions/checkout@v7
        with:
          repository: vivaui/viva
          path: viva
      - uses: actions/setup-go@v7
        with:
          go-version-file: motty/go.mod
          cache-dependency-path: motty/go.sum
      - name: Test the packages that read checked-out data
        working-directory: motty
        run: go test ./internal/completion ./internal/sshconfig -count=1

  # The race detector is the long pole: it runs one package at a time, and it
  # multiplies the memory the tests hold. CI therefore spreads the package list
  # over six jobs (`make race` still runs the whole list for the merge gate),
  # and a growing list keeps being covered because `make race-rest` takes every
  # package the other jobs do not name.
  #
  # The workbench package alone is about half of the race runtime and cannot be
  # overlapped from the inside (its tests share the headless driver's state), so
  # it gets four shards of its own; the other shards are package groups.
  race:
    name: Race (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every shard reports, so one failure does not hide the others.
      fail-fast: false
      matrix:
        include:
          - { name: workbench 1/4, target: race-workbench, shard: 0, cache: workbench-0 }
          - { name: workbench 2/4, target: race-workbench, shard: 1, cache: workbench-1 }
          - { name: workbench 3/4, target: race-workbench, shard: 2, cache: workbench-2 }
          - { name: workbench 4/4, target: race-workbench, shard: 3, cache: workbench-3 }
          - { name: heavy packages, target: race-heavy, cache: heavy }
          - { name: other packages, target: race-rest, cache: rest }
    steps:
      - uses: actions/checkout@v7
        with:
          path: motty
      - uses: actions/checkout@v7
        with:
          repository: vivaui/viva
          path: viva
      # The race jobs keep a build cache of their own below: setup-go's key is
      # the go.sum hash alone, so the first job to save claims it and the race
      # artifacts, which take the longest to rebuild, would never be stored.
      - uses: actions/setup-go@v7
        with:
          go-version-file: motty/go.mod
          cache: false
      - name: Restore the Go module cache
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          # Modules for a given go.sum never change, so this key never does.
          key: go-mod-${{ runner.os }}-${{ hashFiles('motty/go.sum') }}
      - name: Restore this shard's race build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          # A key per run so the cache follows the source instead of freezing at
          # the first save, and restore keys that fall back to this shard's own
          # previous run, then to any shard for the race-instrumented standard
          # library they all share.
          key: go-race-${{ matrix.cache }}-${{ hashFiles('motty/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-race-${{ matrix.cache }}-${{ hashFiles('motty/go.sum') }}-
            go-race-${{ matrix.cache }}-
            go-race-
      - name: Run the race detector
        working-directory: motty
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: make ${{ matrix.target }}
