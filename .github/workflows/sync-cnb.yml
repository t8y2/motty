# Mirrors this repository's branches and tags to CNB
# (https://cnb.cool/dbxio.com/motty), which serves the code from inside mainland
# China. GitHub stays the source of record, so every ref is forced: the mirror is
# never ahead. A push to main, a tag, or a deleted ref syncs at once; the
# schedule repairs anything a run missed.
#
# Needs CNB_TOKEN, an access token with write access to dbxio.com/motty, as a
# repository secret. The destination is fixed here, so a fork never publishes.
name: Sync CNB

on:
  push:
    branches: [main]
    tags: ["**"]
  delete:
  schedule:
    # Three times a day, off the top of the hour so the run does not queue
    # behind every other scheduled job. The push trigger is the main path; this
    # is the repair path for a mirror that missed a run.
    - cron: "23 */8 * * *"
  workflow_dispatch:

# Forced updates to the same refs cannot run at once: a delete landing while a
# push runs would resurrect the ref it just removed.
concurrency:
  group: sync-cnb
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Push refs to CNB
    # Mirror destinations are fixed to the upstream repository; forks must not
    # publish their refs there, even with the secrets mirrored.
    if: github.repository == 't8y2/motty'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out every ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN}" ]; then
            echo "::error::CNB_TOKEN is not set: add a CNB access token with write access to dbxio.com/motty as a repository secret"
            exit 1
          fi
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/dbxio.com/motty.git"

          # A push never removes a ref, so a deleted tag or branch has to be
          # deleted on the mirror explicitly.
          if [ "${GITHUB_EVENT_NAME}" = "delete" ]; then
            case "${GITHUB_REF_TYPE}" in
              tag) git push cnb ":refs/tags/${GITHUB_REF_NAME}" ;;
              branch) git push cnb ":refs/heads/${GITHUB_REF_NAME}" ;;
            esac
          fi

          # The checkout only holds the triggering branch, so read the branch
          # list from origin. The mirror/ namespace keeps those refs from
          # colliding with the checked-out branch.
          git fetch --prune --tags origin '+refs/heads/*:refs/heads/mirror/*'
          git push cnb --force 'refs/heads/mirror/*:refs/heads/*'
          git push cnb --force --tags
