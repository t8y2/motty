# Used by `viva package` and `viva build` (see ../viva/docs/decisions/0017-build-and-package-commands.md).
#   viva package --format app,dmg                     # macOS bundle and disk image
#   viva package --target windows --arch amd64         # NSIS installer (not on Apple Silicon: see the ADR)
#   viva package --target linux --arch amd64 --format tar.gz,deb
[app]
name = "Motty"
id = "dev.motty.app"
version = "0.4.36"
executable = "motty"
package = "./cmd/motty"
icon = "assets/icon.png"
# Links the system hands to the program (see docs/decisions/0028 in ../viva).
url_schemes = ["ssh", "telnet", "sftp", "xshell", "xftp"]

[[app.file_types]]
name = "Markdown document"
extensions = ["md", "markdown"]
mime = "text/markdown"
uti = "net.daringfireball.markdown"

[build]
out = "build/dist"

[mac]
category = "public.app-category.developer-tools"
copyright = "Motty"
entitlements = "assets/macos.entitlements"

[mac.info]
NSMicrophoneUsageDescription = "A program running in a Motty local terminal is requesting access to your microphone."

[mac.dmg]
background = "assets/dmg-background.png"

[windows]
publisher = "Motty"

[linux]
category = "System"
comment = "SSH client with terminal, SFTP, port forwarding and an AI assistant"
keywords = ["ssh", "terminal", "sftp", "remote"]
